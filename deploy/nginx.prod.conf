map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Legacy config (kept for reference).
# The production docker stack now uses `deploy/nginx.prod.conf.template`
# so you can set `DOMAIN` and `CERT_DOMAIN` via `.env.production`.

# HTTP: serve ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    server_name looksgood.com www.looksgood.com;
    client_max_body_size 100M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: main site + API
server {
    listen 443 ssl http2;
    server_name looksgood.com www.looksgood.com;
    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/www.looksgood.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.looksgood.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve ACME HTTP-01 for renewal over HTTPS too (harmless)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://backend:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Allow API calls without the /api prefix (mobile clients that hit https://www.looksgood.com/auth/login etc.).
    location ~ ^/(auth|ai|video|feed|subscription|ads|social|stories)/ {
        proxy_pass http://backend:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
