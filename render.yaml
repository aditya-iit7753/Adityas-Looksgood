databases:
  - name: looksgood-postgres
    plan: basic-1gb

services:
  # Backend API (FastAPI)
  - name: looksgood-api
    type: web
    runtime: docker
    region: frankfurt
    plan: starter
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Optional custom domain. The service is also reachable at its Render URL.
    domains:
      - api.looksgoods.com
    disk:
      name: generated
      mountPath: /app/generated
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GENERATED_STORAGE_DIR
        value: /app/generated
      - key: DATABASE_URL
        fromDatabase:
          name: looksgood-postgres
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://looksgood-api.onrender.com
      - key: CORS_ORIGINS
        value: https://looksgood-web.onrender.com,https://looksgoods.com,https://www.looksgoods.com
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: STRIPE_SUCCESS_URL
        value: https://looksgood-web.onrender.com/?sub=success
      - key: STRIPE_CANCEL_URL
        value: https://looksgood-web.onrender.com/?sub=cancel
      - key: OPENAI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUBSCRIPTION_PRICE_PRO
        sync: false
      - key: STRIPE_SUBSCRIPTION_PRICE_CREATOR
        sync: false

  # Static web frontend (web-frontend/)
  - name: looksgood-web
    type: web
    runtime: static
    staticPublishPath: web-frontend
    autoDeployTrigger: commit
    domains:
      - looksgoods.com
      - www.looksgoods.com
    envVars:
      - key: PUBLIC_API_URL
        value: https://looksgood-api.onrender.com/api
    headers:
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache
      - path: /config.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
