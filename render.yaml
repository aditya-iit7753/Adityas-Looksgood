databases:
  - name: looksgood-postgres
    plan: basic-1gb

services:
  # Backend API (FastAPI)
  - name: looksgood-api
    type: web
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.prod.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Optional: use a dedicated API domain
    domains:
      - api.looksgood.com
    disk:
      name: generated
      mountPath: /app/generated
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GENERATED_STORAGE_DIR
        value: /app/generated
      - key: DATABASE_URL
        fromDatabase:
          name: looksgood-postgres
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://api.looksgood.com
      - key: CORS_ORIGINS
        value: https://looksgood.com,https://www.looksgood.com
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"
      # Optional (set in Render dashboard):
      # - OPENAI_API_KEY
      # - CLOUDINARY_*
      # - STRIPE_*

  # Static web frontend (web-frontend/)
  - name: looksgood-web
    type: web
    runtime: static
    staticPublishPath: web-frontend
    autoDeployTrigger: commit
    domains:
      - looksgood.com
      - www.looksgood.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
